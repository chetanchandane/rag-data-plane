# Deploy (step 10d, DECISIONS 2026-11-20): called by ci.yml after the production migrations,
# on pushes to main only, so the schema is always ready before new code runs.
#
# 1. Build and push the worker image, tagged with the commit SHA.
# 2. terraform plan for infra/envs/prod, then refuse the plan if it deletes or replaces
#    anything (those changes are applied by hand after review, see infra/envs/prod/README.md).
# 3. Apply exactly that plan, then check the worker Lambda runs the new image.
#
# AWS access is the bootstrap deploy role through OIDC; no stored keys.
# GitHub settings: environment `prod` (main only) with the secret ALERT_EMAIL.

name: Deploy

on:
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: 905418224080.dkr.ecr.us-east-2.amazonaws.com
  REPOSITORY: ragdp-worker
  FUNCTION: ragdp-worker
  TF_VERSION: "1.17.2"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
      id-token: write # to sign in to AWS with OIDC
    # Never two deploys at once (the S3 state lock would also stop the second one).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      IMAGE_TAG: ${{ github.sha }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # infra/bootstrap output deploy_role_arn.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::905418224080:role/ragdp-github-deploy
          role-session-name: deploy-${{ github.run_id }}
          aws-region: us-east-2

      # Tags are immutable in ECR, so a rerun of this job finds its image already there and
      # must not push again. Any error other than "not found" stops the job.
      - name: Build and push the worker image
        working-directory: .
        run: |
          if out=$(aws ecr describe-images --repository-name "$REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "Image $IMAGE_TAG is already in ECR; not building it again."
            exit 0
          elif ! grep -q ImageNotFoundException <<<"$out"; then
            echo "$out"
            exit 1
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          # --provenance=false: Lambda rejects the image index that build attestations create.
          docker build --platform linux/amd64 --provenance=false \
            -f services/worker/Dockerfile -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # readonly: CI uses the committed provider versions and hashes, never newer ones.
      - run: terraform init -lockfile=readonly

      - name: Terraform plan
        run: terraform plan -var-file=prod.tfvars -var "worker_image_tag=${IMAGE_TAG}" -out=tfplan

      # A replacement is a delete plus a create, so both show up as "delete". The summary lists
      # addresses and actions only, never values.
      - name: Refuse deletes and replacements
        run: |
          terraform show -json tfplan > plan.json
          {
            echo "### Terraform plan"
            jq -r '.resource_changes[] | select(.change.actions != ["no-op"])
              | "- \(.change.actions | join("+")) `\(.address)`"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          destructive=$(jq -r '.resource_changes[] | select(.change.actions | index("delete"))
            | "\(.change.actions | join("+")) \(.address)"' plan.json)
          if [ -n "$destructive" ]; then
            echo "::error::The plan deletes or replaces resources. Review it and apply it by hand."
            echo "$destructive"
            exit 1
          fi

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Check the worker runs the new image
        run: |
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          image=$(aws lambda get-function --function-name "$FUNCTION" \
            --query Code.ImageUri --output text)
          echo "Worker image: $image"
          test "$image" = "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
